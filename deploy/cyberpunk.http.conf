limit_req_zone $binary_remote_addr zone=cyberpunk_ai:1m rate=6r/m;

server {
    listen 80;
    server_name cyberpunk.lwnavx.com;
    root /var/www/cyberpunk/current;
    index index.html;
    client_max_body_size 512k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
    location /api/ { return 404; }

    # No server-owned key: callers supply their own Authorization header.
    location = /api/providers/glm/chat/completions {
        limit_req zone=cyberpunk_ai burst=2 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        if ($http_authorization = "") { return 401; }
        proxy_pass https://open.bigmodel.cn/api/paas/v4/chat/completions;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_set_header Host open.bigmodel.cn;
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 65s;
        add_header Cache-Control "no-store" always;
    }
}
